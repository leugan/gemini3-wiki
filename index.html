<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 3.0 文档</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style type="text/tailwindcss">
    /* Global Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }

    /* 
      Typography System (Prose) 
      Applied via ViewEncapsulation.None in Angular component
    */
    
    .prose {
      @apply text-slate-300 text-base leading-relaxed;
    }

    /* Headings */
    .prose h1 {
      @apply text-3xl font-bold text-white mb-10 mt-4 tracking-tight border-b border-slate-800 pb-6;
    }
    
    .prose h2 {
      @apply text-2xl font-semibold text-slate-100 mb-6 mt-12 flex items-center relative pl-4;
    }
    .prose h2::before {
      content: '';
      @apply absolute left-0 w-1 h-6 bg-sky-500 rounded-full;
    }

    .prose h3 {
      @apply text-xl font-medium text-sky-200 mb-4 mt-8;
    }
    
    /* Paragraphs & Text */
    .prose p {
      @apply mb-6 text-slate-300 leading-8 text-[1.05rem];
    }
    
    .prose strong {
      @apply text-white font-bold;
    }

    /* Lists */
    .prose ul {
      @apply list-disc list-outside ml-6 mb-6 space-y-2 text-slate-300 marker:text-slate-500;
    }
    .prose ol {
      @apply list-decimal list-outside ml-6 mb-6 space-y-2 text-slate-300 marker:text-slate-500;
    }
    .prose li {
      @apply pl-2 leading-8;
    }
    
    /* Links */
    .prose a {
      @apply text-sky-400 no-underline border-b border-sky-400/30 hover:border-sky-400 transition-colors pb-0.5;
    }

    /* Blockquotes */
    .prose blockquote {
      @apply border-l-4 border-sky-500 bg-slate-900/30 py-4 px-6 my-8 rounded-r-lg italic text-slate-400 shadow-sm;
    }

    /* Tables - Enhanced Styling */
    .prose table {
      @apply w-full text-left border-collapse my-8 border border-slate-700 rounded-lg overflow-hidden;
      /* Ensures border radius clips content */
      border-style: hidden; 
      box-shadow: 0 0 0 1px rgb(51 65 85); /* Slate-700 equivalent */
    }
    
    .prose thead {
      @apply bg-slate-800 text-slate-100;
    }
    
    .prose th {
      @apply p-4 font-semibold text-sm border-b border-slate-600 tracking-wide;
    }
    
    .prose td {
      @apply p-4 text-sm border-b border-slate-800/50 text-slate-300 leading-6 align-top;
    }
    
    .prose tr:last-child td {
      @apply border-b-0;
    }
    
    .prose tr:hover td {
      @apply bg-slate-800/30 transition-colors;
    }

    /* Inline Code */
    .prose :not(pre) > code {
      @apply font-mono text-[0.9em] text-sky-300 bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-700/60 mx-1;
    }

    /* Pre / Code Blocks */
    /* Note: internal structure handled by ArticleComponent JS, this handles the container */
    .prose pre {
      @apply bg-slate-900 rounded-lg overflow-x-auto border border-slate-700/60 shadow-lg my-8;
    }

    /* Horizontal Rule */
    .prose hr {
      @apply border-t border-slate-800 my-12;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://esm.sh/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://esm.sh/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://esm.sh/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://esm.sh/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/forms": "https://esm.sh/@angular/forms@^21.0.6?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@^21.0.6?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@^21.0.6?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@^21.0.6?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@^21.0.6?external=rxjs",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0?external=rxjs"
  }
}
</script>
</head>
<body class="bg-slate-950 text-slate-200 h-screen overflow-hidden selection:bg-sky-500/30">
  <app-root></app-root>
</body>
</html>
